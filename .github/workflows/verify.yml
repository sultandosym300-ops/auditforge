name: Verify audit environment

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  offline-and-isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build evaluator and policy images
        run: |
          docker build -t auditforge-evaluator:2.0.1 .
          docker build -f Dockerfile.policy -t auditforge-policy:1.0 .
          python3 - <<'PY'
          import os, subprocess
          files = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          tracked = sum(os.stat(f).st_size for f in files if f)
          images = sum(int(subprocess.check_output(['docker', 'image', 'inspect', '--format', '{{.Size}}', tag]))
                       for tag in ('auditforge-evaluator:2.0.1', 'auditforge-policy:1.0'))
          print(f'Tracked bytes: {tracked}. Image bytes including shared layers twice: {images}.')
          assert tracked + images < 1_000_000_000
          PY
      - name: Run independent jury offline with two CPUs and four GiB
        run: |
          docker run --rm --network none --cpus 2 --memory 4g \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/submission \
            -w /submission auditforge-evaluator:2.0.1 sh -ec '
            python -c "import sys; assert sys.version_info[:2] == (3, 11)"
            python -m scripts.ultimate_verify --seed 801973140685
            python -m scripts.world_comparison --output work/world-comparison.json
            python -m auditforge.shortcut_hunter --output work/shortcut-hunter.json
            python -m scripts.adversarial_logic
            python -m scripts.generator_probe --output work/generator-probe.json
            python -m scripts.optimization_benchmark --output work/optimization-ci.json
            python -m scripts.v3_benchmark --output work/v3-ci.json
            python -m scripts.v3_budget_probe
            python -m scripts.recognition_demo
            python -c "from pathlib import Path; p=Path(\"/sys/fs/cgroup\"); print({k:(p/k).read_text().strip() for k in (\"cpu.max\",\"memory.max\",\"memory.peak\")}); assert (p/\"memory.max\").read_text().strip()==str(4*1024**3); q,t=map(int,(p/\"cpu.max\").read_text().split()); assert q==2*t"
          '
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check worker retry after transient initialization failure
        run: node scripts/check_worker_retry.mjs
      - name: Confirm effective policy container boundary
        run: python -m scripts.verify_container
      - name: Reconcile through the isolated policy broker
        run: |
          python -m scripts.jury_broker
