name: Verify audit environment

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  offline-and-isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build evaluator and policy images
        run: |
          docker build -t auditforge-evaluator:1.1.4 .
          docker build -f Dockerfile.policy -t auditforge-policy:1.0 .
          python3 - <<'PY'
          import os, subprocess
          files = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          tracked = sum(os.stat(f).st_size for f in files if f)
          images = sum(int(subprocess.check_output(['docker', 'image', 'inspect', '--format', '{{.Size}}', tag]))
                       for tag in ('auditforge-evaluator:1.1.4', 'auditforge-policy:1.0'))
          print(f'Tracked bytes: {tracked}. Image bytes including shared layers twice: {images}.')
          assert tracked + images < 1_000_000_000
          PY
      - name: Run independent jury offline with two CPUs and four GiB
        run: |
          docker run --rm --network none --cpus 2 --memory 4g \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/submission \
            -w /submission auditforge-evaluator:1.1.4 sh -ec '
            python -c "import sys; assert sys.version_info[:2] == (3, 11)"
            python -m scripts.jury_gauntlet --seed 978533501331
            python -c "from pathlib import Path; p=Path(\"/sys/fs/cgroup\"); print({k:(p/k).read_text().strip() for k in (\"cpu.max\",\"memory.max\",\"memory.peak\")}); assert (p/\"memory.max\").read_text().strip()==str(4*1024**3); q,t=map(int,(p/\"cpu.max\").read_text().split()); assert q==2*t"
          '
      - name: Confirm effective policy container boundary
        run: python3 -m scripts.verify_container
      - name: Reconcile through the isolated policy broker
        run: |
          python3 - <<'PY'
          from auditforge.agent_runner import run
          from auditforge.generator import TYPES
          for i in range(3):
              result = run(6087193912+i, config=dict(invoices=200, clean=i==0,
                           interaction=i, counts=dict.fromkeys(TYPES, 3), boundary_payments=True))
              seen = set()
              for row in result["trajectory"]:
                  assert row["reward"] == 0
                  if row["action"]["tool"] == "list_records":
                      for item in row["observation"]["result"]["records"]:
                          seen.add(item.get("row_id") or item["doc_id"])
                  if row["action"]["tool"] == "submit":
                      for claim in row["action"]["findings"]["findings"]:
                          assert seen.issuperset(claim["affected_ids"] + claim["evidence_ids"])
              assert result["containment"] == "docker" and result["report"]["f1"] == 1
              assert len(result["trajectory"]) <= 100 and result["trajectory"][-1]["terminated"]
              print("Isolated policy", i, len(result["trajectory"]), result["report"])
          PY
